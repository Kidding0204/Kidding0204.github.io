---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back-link" href="{{ '/archive/' | relative_url }}">← 所有文章</a>
    <p class="eyebrow">文章 / {{ page.date | date: '%Y.%m.%d' }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-deck">{{ page.description | escape }}</p>{% endif %}
    {% if page.tags.size > 0 %}<div class="tags" aria-label="标签">{% for tag in page.tags %}<span class="tag">{{ tag | escape }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <div class="post-end"><span aria-hidden="true">✳</span><a href="{{ '/archive/' | relative_url }}">继续阅读其他文章 →</a></div>
</article>
